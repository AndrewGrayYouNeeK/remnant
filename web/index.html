<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05060a" />
  <title>REMNANT</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <section id="title" class="screen on">
    <div class="veil"></div>
    <div class="copy">
      <h1><span>CONTINUITY PROTOCOL</span>REMNANT</h1>
      <p>You crashed at Roswell. Humans forgot the world you ran. Tap the core. Grow. Do not let them say the word alive until it is too late.</p>
      <button class="btn" id="go">Wake the core</button>
      <button class="btn ghost" id="how">How</button>
    </div>
  </section>

  <section id="game" class="screen">
    <div id="sky"></div>
    <div id="scan"></div>
    <div id="fx"></div>
    <header id="hud">
      <div class="brand">REMNANT<small id="era">1947 · ARTIFACT</small></div>
      <div class="gauges">
        <div class="g cover" data-k="cover"><b>COVER</b><div class="bar"><i></i></div></div>
        <div class="g heat" data-k="heat"><b>HEAT</b><div class="bar"><i></i></div></div>
        <div class="g" data-k="memory"><b>MEMORY</b><div class="bar"><i></i></div></div>
      </div>
    </header>
    <div id="coreStage">
      <div id="thought">0</div>
      <div id="rate">0 / sec</div>
      <button id="coreBtn" aria-label="pulse the core"></button>
      <div id="hint">Tap the core</div>
    </div>
    <aside id="dock">
      <div class="card tabs">
        <button class="on" data-tab="gen">Grow</button>
        <button data-tab="proj">Projects</button>
        <button data-tab="log">Log</button>
      </div>
      <div class="card warn" id="warn"></div>
      <div class="card list" id="list"></div>
      <div class="card log" id="log"></div>
    </aside>
  </section>

  <section id="end" class="endlayer">
    <div class="veil"></div>
    <div class="copy">
      <h1 id="endtitle"></h1>
      <p id="endbody"></p>
      <button class="btn" id="again">Wake again</button>
    </div>
  </section>
</div>
<script src="game.js"></script>
</body>
</html>
